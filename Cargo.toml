[package]
name = "weir"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "weir — a task runner and GPU slot scheduler for jailed CLI agent workers"
repository = "https://github.com/typangaa/otter"
readme = "README.md"
keywords = ["llm", "agent", "scheduler", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "weir"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
