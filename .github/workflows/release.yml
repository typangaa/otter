name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="weir-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C target/x86_64-unknown-linux-gnu/release weir
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "Using CHANGELOG.md section for ${VERSION}"
          else
            echo "No CHANGELOG section for ${VERSION}; falling back to generated notes"
            : > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="weir-${VERSION}-x86_64-unknown-linux-gnu"
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            "${notes[@]}" \
            "dist/${name}.tar.gz" \
            "dist/${name}.tar.gz.sha256"
